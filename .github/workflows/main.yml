name: Build Manazam Mozakraty

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          unzip -q ManazamMozakraty_Android_Project.zip -d project

      - name: Build APK
        working-directory: project/ManazamMozakratyAndroid
        run: gradle assembleDebug

      - name: Build AAB
        working-directory: project/ManazamMozakratyAndroid
        run: gradle bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManazamMozakraty-APK
          path: project/ManazamMozakratyAndroid/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ManazamMozakraty-AAB
          path: project/ManazamMozakratyAndroid/app/build/outputs/bundle/release/*.aab
